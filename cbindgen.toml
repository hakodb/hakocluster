language = "C"
cpp_compat = true
braces = "SameLine"
line_length = 100
tab_width = 4
header = "/* Auto-generated by cbindgen. Do not edit manually. */"
include_guard = "HAKOCLUSTER_H"
pragma_once = true

[parse]
parse_deps = false

# NOTE: no [defines] section on purpose (same call as hakodb): cbindgen
# evaluates neither feature nor target cfgs here, so every build emits
# the full API as unconditional declarations. Declarations without
# definitions are harmless unless called (link error, fail-closed).

[fn]
rename_args = "snake_case"

[struct]
rename_fields = "snake_case"
