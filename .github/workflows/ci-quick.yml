# Quick gate for branch protection (required check on main).
#
# Deliberately NOT the release matrix and NOT fmt: answers one question
# fast — does it still compile (locked)? Cache makes PR runs incremental.

name: ci-quick

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: quick-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check (incl. tests)
        # ponytail: no --locked (libraries don't commit lockfiles; the
        # resolver pins what Cargo.toml allows — bins lock, libs don't).
        run: cargo check --tests

  # Tailer transports are feature-gated (default build stays socket-only),
  # so the default check above never compiles them — unix-only code
  # already bit us once that way. This job compiles + tests both lanes.
  check-tailers:
    name: quick-check-tailers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check + test with tailer features
        # All three states (mesh-only, cloud-only, both): cfg-gated
        # matches must compile in every combination, not just both-on.
        run: |
          cargo test --features tailer-mesh,tailer-cloud
          cargo check --tests --no-default-features --features tailer-mesh
          cargo check --tests --no-default-features --features tailer-cloud
