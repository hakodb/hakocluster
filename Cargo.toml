[package]
name = "hakocluster"
version = "0.1.0"
edition = "2021"
description = "In-process dispatcher over N hakodb instances: reads fan out, writes route, socket_sync keeps replicas identical"
license = "MIT"
repository = "https://github.com/hakodb/hakocluster"

[dependencies]
# ponytail: only the socket-sync lane (tokio). net-sync/cloud-sync pull
# mdns/rustls/tungstenite — unneeded here, and each is minutes of compile.
hakodb = { version = "0.9", default-features = false, features = ["socket-sync"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
