[package]
name = "hakocluster"
version = "0.3.10"
edition = "2021"
description = "In-process dispatcher over N hakodb instances: reads fan out, writes route, socket_sync keeps replicas identical"
license = "MIT"
repository = "https://github.com/hakodb/hakocluster"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ponytail: only the socket-sync lane (tokio). net-sync/cloud-sync pull
# mdns/rustls/tungstenite — unneeded here, and each is minutes of compile.
hakodb = { version = "0.15.0", default-features = false, features = ["socket-sync"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
# JSON boundary for the C ABI (go/pascal consumers): docs and queries
# cross as UTF-8 strings, never as structs.
serde_json = "1"

[build-dependencies]
# Header generation (same pattern as hakodb): cbindgen emits
# target/<profile>/hakocluster.h from the #[no_mangle] fns every build.
cbindgen = "0.28"

# ponytail: same size treatment as hakodb (duelled there): thin-LTO +
# single codegen unit + strip, opt-level 3 kept (opt-z rejected: +20-50%
# on hot read paths). No opt-level experiment needed here.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
